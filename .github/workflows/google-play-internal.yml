name: Publish Google Play internal test

# 只有版本標籤會發布，一般 push 不會觸發。
on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

# 同一時間只允許一個發布工作操作 Play Console。
concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      # 固定 Action 的 commit，避免第三方標籤異動影響發布。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^android-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw '標籤必須是 android-v主版號.次版號.修訂版號，例如 android-v1.1.1。'
          }
          if ($env:VERSION_CODE_BASE -notmatch '^\d+$') {
            throw '請設定 Repository variable PLAY_VERSION_CODE_BASE，至少等於 Play Console 已使用的最大版本代碼。'
          }
          $versionCode = [long]$env:VERSION_CODE_BASE + [long]$env:RUN_NUMBER
          if ($versionCode -lt 1 -or $versionCode -gt 2100000000) { throw '版本代碼超出 Android 範圍。' }
          foreach ($name in @('KEYSTORE_BASE64', 'KEY_ALIAS', 'KEY_PASSWORD', 'STORE_PASSWORD', 'PLAY_JSON')) {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) { throw "缺少必要 Secret：$name，請參考 docs/google-play-deployment.md。" }
          }
          $account = $env:PLAY_JSON | ConvertFrom-Json
          if ($account.type -ne 'service_account' -or !$account.client_email -or !$account.private_key) {
            throw 'Google Play Secret 必須是完整的服務帳戶 JSON。'
          }
          "PLAY_VERSION_NAME=$($env:RELEASE_TAG.Substring('android-v'.Length))" >> $env:GITHUB_ENV
          "PLAY_VERSION_CODE=$versionCode" >> $env:GITHUB_ENV

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { throw 'MAUI Android workload 安裝失敗。' }

      - name: Install required Android SDK components
        run: |
          dotnet build ADoubleB/ADoubleB.csproj -t:InstallAndroidDependencies -f net10.0-android `
            -p:TargetFrameworks=net10.0-android -p:AndroidSdkDirectory="$env:ANDROID_HOME" `
            -p:JavaSdkDirectory="$env:JAVA_HOME" -p:AcceptAndroidSdkLicenses=true
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK 元件安裝失敗。' }

      - name: Build and sign AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./scripts/publish-android.ps1 -VersionName $env:PLAY_VERSION_NAME -VersionCode $env:PLAY_VERSION_CODE

      - name: Save signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-${{ env.PLAY_VERSION_NAME }}-${{ env.PLAY_VERSION_CODE }}
          path: artifacts/play-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.companyname.adoubleb
          releaseFiles: artifacts/play-release.aab
          releaseName: ${{ github.ref_name }}
          track: internal
          status: completed

      - name: Write release summary
        run: |
          "## Google Play 內部測試已上傳" >> $env:GITHUB_STEP_SUMMARY
          "版本：$env:PLAY_VERSION_NAME；版本代碼：$env:PLAY_VERSION_CODE" >> $env:GITHUB_STEP_SUMMARY
          "請至 Play Console 確認處理狀態與測試人員設定，測試完成後可手動推進正式發布。" >> $env:GITHUB_STEP_SUMMARY
